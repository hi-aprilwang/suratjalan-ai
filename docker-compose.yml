version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suratjalan-ai-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MOCK_MODE=${MOCK_MODE:-false}
    volumes:
      - ./datasets/samples:/app/datasets/samples:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: suratjalan-ai-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://backend:8000/api
    depends_on:
      - backend
    restart: unless-stopped
